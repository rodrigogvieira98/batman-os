[build-system]
# ⚠️ 77 e o piso do PEP 639 (`license` como string SPDX + `license-files`).
# A forma antiga, `license = {file = "LICENSE"}`, esta depreciada desde a 78.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batman-os"
version = "0.1.0"
description = "Batman OS — Sistema Operacional Cognitivo Determinístico"
requires-python = ">=3.11"
# ⚠️ Ate 11/09 o projeto NAO declarava licenca nenhuma, e o arquivo `LICENSE`
# so existia no repositorio publico -- a arvore viva ficou sem ele quando as
# duas historias divergiram. Projeto sem licenca declarada e ambiguo mesmo
# sendo privado: quem herda nao sabe o que pode fazer com o codigo.
#
# ⚠️ SPDX como string, sem o classifier `License :: OSI Approved ::` -- o PEP
# 639 depreciou o classifier, e declarar os dois e declarar duas vezes.
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.9",
    "ruff>=0.4",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]
local-llm = [
    "llama-cpp-python>=0.3",
]
observe = [
    # Coleta de infra/portas/processos. Dependencia OPCIONAL (como
    # `llama-cpp-python` e do `local-llm`): o subsistema `observe` funciona
    # com collectors injetados e so exige psutil para a coleta real na VPS.
    # O EndpointCollector usa `urllib` (stdlib) — sem dependencia nova.
    "psutil>=5.9",
]

[project.scripts]
batman = "batman_os.cli.batman:main"

[tool.setuptools.packages.find]
where = ["src"]

# As regras carregam suas specs de `Path(__file__).parent / "specs"` com `glob("*.json")`.
# Sem esta secao o setuptools NAO inclui arquivo nao-.py na wheel; o glob entao percorre um
# diretorio inexistente, devolve lista vazia, NAO levanta erro, e o scan roda com ZERO regras
# — saindo com exit 0 e "0 achado(s)". Verde por vacuidade.
#
# Achado em 2026-08-10 pelo CI do radar-preditivo (run 31352717091): o scan enumerou 1.382
# arquivos e reportou 0 achados, enquanto o mesmo commit dava 770 em qualquer outro lugar.
# O diagnostico no runner respondeu "specs instaladas: DIRETORIO AUSENTE".
#
# Por que nao apareceu antes: numa arvore de desenvolvimento existe
# `src/batman_os.egg-info/SOURCES.txt` de builds anteriores, e o setuptools o reaproveita. A
# wheel construida AQUI levava as 283 specs; a construida de um clone limpo, nenhuma. Testar
# empacotamento na arvore suja mede o cache, nao a configuracao — foi o que quase me fez
# descartar esta hipotese como errada.
#
# `scripts/verificar_head_autocontido.sh` nao pegava porque compara HEAD contra a arvore
# rodando da ARVORE-FONTE; este defeito so existe no pacote INSTALADO.
[tool.setuptools.package-data]
"batman_os" = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "llama_cpp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psutil.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# ⚠️ Linhas CAPTURADAS do `auth.log`, nao escritas. Quebrar uma para caber em
# 100 colunas mudaria o gabarito que o teste existe para prender.
"tests/observe/janela_real_ssh.py" = ["E501"]
